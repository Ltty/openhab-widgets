<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<style>
html,body{margin:0;background:#000;width:100%;height:100%;overflow:hidden}
#s{color:#aaa;font:12px/1.6 sans-serif;padding:8px;text-align:center;position:absolute;width:100%;top:0;z-index:1}
video{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:contain}
</style>
</head>
<body>
<div id="s"></div>
<video id="v" autoplay muted playsinline></video>
<script src="hls.min.js"></script>
<script>
(function() {
  var fe = window.frameElement;
  if (!fe) return;
  var w = document.documentElement.clientWidth || 300;
  fe.removeAttribute('height');
  fe.style.setProperty('width', '100%', 'important');
  fe.style.setProperty('height', w + 'px', 'important');
  fe.style.setProperty('border', 'none', 'important');
})();

var params = new URLSearchParams(location.search);
var src = params.get('stream') || '';
var v = document.getElementById('v');
var s = document.getElementById('s');

if (!src) {
  s.textContent = 'No stream URL — set cameraThing prop';
} else {
  s.textContent = Hls.isSupported() ? 'Connecting…' : 'MSE unavailable';
  v.addEventListener('playing', function() { s.style.display = 'none'; });

  function startHls() {
    var hls = new Hls({
      startPosition: -1,
      maxLoadingDelay: 2,
      manifestLoadingMaxRetry: 8,
      manifestLoadingRetryDelay: 500,
      manifestLoadingMaxRetryTimeout: 10000,
      liveSyncDurationCount: 2,
      liveMaxLatencyDurationCount: 4,
      maxBufferLength: 1,
      maxMaxBufferLength: 3,
      enableWorker: false
    });
    hls.loadSource(src);
    hls.attachMedia(v);
    hls.on(Hls.Events.MANIFEST_PARSED, function() { s.textContent = 'Buffering…'; v.play(); });
    hls.on(Hls.Events.ERROR, function(e, d) {
      if (d.fatal) {
        s.style.display = ''; s.textContent = 'Reconnecting…';
        setTimeout(function() { location.reload(); }, 5000);
      } else if (d.details === Hls.ErrorDetails.BUFFER_STALLED_ERROR) {
        try { hls.startLoad(); } catch(ex) {}
      }
    });

    // Stall watchdog: nudge after 8s stall, reload after 20s
    var lastTime = -1, lastTimeAt = 0, recovering = false;
    setInterval(function() {
      if (v.paused || v.ended || v.readyState < 2) return;
      var ct = v.currentTime;
      var now = Date.now();
      if (ct !== lastTime) { lastTime = ct; lastTimeAt = now; recovering = false; return; }
      var stalled = now - lastTimeAt;
      if (stalled > 8000 && !recovering) {
        recovering = true;
        s.style.display = ''; s.textContent = 'Reconnecting…';
        try { hls.stopLoad(); hls.startLoad(-1); } catch(ex) {}
      } else if (stalled > 20000) {
        location.reload();
      }
    }, 3000);
  }

  // ipcamera binding quirks (5.2.x): its /ipcamera.m3u8 handler always sleeps 4.5 s (isAlive()
  // is false after the first call for HLS), so a player refreshing it starves; and that path
  // never extends the keep-alive, so ffmpeg is killed after ~60-90 s. Hence:
  //  - tell the binding to keep the stream running (StartStream ON = keep-alive -1),
  //  - read the playlist from the same HLS folder via /static/doorbell/hls (symlink, instant).
  // It also leaves the previous run's playlist + segments on disk (numbering restarts at 0), so
  // wait until the playlist content changes (ffmpeg is rewriting it) before attaching the player.
  var startItem = params.get('startItem') || 'GF_Entryway_Doorbell_StartStream';
  var staticSrc = params.get('static') || '/static/doorbell/hls/ipcamera.m3u8';
  function setStream(cmd) {
    var url = '/rest/items/' + startItem;
    try {
      if (!(navigator.sendBeacon && navigator.sendBeacon(url, new Blob([cmd], {type: 'text/plain'})))) throw 0;
    } catch(ex) {
      try { fetch(url, {method: 'POST', headers: {'Content-Type': 'text/plain'}, body: cmd, keepalive: true}); } catch(e2) {}
    }
  }
  setStream('ON');
  // Nobody watching -> OFF (keep-alive 1: the binding stops ffmpeg within ~8-16 s). Covers closing
  // the popup/tab and backgrounding the app; coming back reloads and restarts the stream.
  window.addEventListener('pagehide', function() { setStream('OFF'); });
  document.addEventListener('visibilitychange', function() {
    if (document.hidden) { setStream('OFF'); wasHidden = true; }
    else if (wasHidden) { location.reload(); }
  });
  var wasHidden = false;

  function fetchPlaylist(url) {
    return fetch(url, {cache: 'no-store'}).then(function(r) { return r.ok ? r.text() : ''; }, function() { return ''; });
  }
  function waitForFresh() {
    fetchPlaylist(staticSrc).then(function(probe) {
      var url = probe ? staticSrc : src;   // static folder missing -> fall back to the servlet URL
      var first = probe || null, tries = 0;
      (function poll() {
        fetchPlaylist(url).then(function(txt) {
          if (first === null) first = txt;
          else if (txt && txt !== first) { src = url; startHls(); return; }
          if (++tries > 120) { location.reload(); return; }
          setTimeout(poll, 500);
        });
      })();
    });
  }

  if (Hls.isSupported()) {
    waitForFresh();
  } else if (v.canPlayType('application/vnd.apple.mpegurl')) {
    v.src = src; s.style.display = 'none';
  }
}
</script>
</body>
</html>
