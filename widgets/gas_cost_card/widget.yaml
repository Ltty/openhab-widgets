uid: gas_cost_card
tags:
- card
- energy
props:
  parameters:
  - context: item
    description: The Number:Currency item to display
    label: Cost item
    name: item
    required: true
    type: TEXT
    groupName: data
  - context: item
    description: Optional YoY % item. Leave blank to hide badge.
    label: Year-over-year % item
    name: yoyItem
    required: false
    type: TEXT
    groupName: data
  - context: item
    description: Optional predicted year/period-end cost item. Leave blank to hide.
    label: Predicted end item
    name: predictedItem
    required: false
    type: TEXT
    groupName: data
  - context: item
    description: Optional previous year/period total for comparison. Leave blank to hide.
    label: Previous total item
    name: prevTotalItem
    required: false
    type: TEXT
    groupName: data
  - default: Cost
    description: Label shown above the value (e.g. "Electricity cost – billing period")
    label: Card title
    name: title
    required: false
    type: TEXT
    groupName: look
  parameterGroups:
  - name: data
    label: Cost data
  - name: look
    label: Look
timestamp: 2026-10-05T14:52:20.291+0200
component: f7-card
config:
  style:
    padding: '0'
    margin: '0'
    border-radius: 18px
slots:
  default:
  - component: f7-card-content
    config:
      style:
        padding: 14px 14px 12px
    slots:
      default:
      - component: Label
        config:
          text: =props.title || 'Cost'
          style:
            display: block
            font-size: 12px
            opacity: '0.7'
      - component: Label
        config:
          text: '=(props.item && items[props.item] && items[props.item].state !== ''NULL'' && items[props.item].state !== ''UNDEF'') ? ''€''+Math.round(Number.parseFloat(items[props.item].state)) : ''–'''
          style:
            display: block
            font-size: 26px
            font-weight: '700'
            line-height: '1.1'
            margin: 6px 0 4px
      - component: f7-row
        config:
          style:
            display: flex
            justify-content: flex-start
            margin: '0'
          visible: =props.yoyItem && items[props.yoyItem] && items[props.yoyItem].state !== 'NULL' && items[props.yoyItem].state !== 'UNDEF'
        slots:
          default:
          - component: Label
            config:
              text: '=(Number.parseFloat(items[props.yoyItem].state)<0 ? ''▼ '' : ''▲ +'')+Math.abs(Number.parseFloat(items[props.yoyItem].state)).toFixed(0)+'' % YoY'''
              style:
                border-radius: 12px
                font-size: 12px
                font-weight: '500'
                padding: 1px 8px
                background: '=Number.parseFloat(items[props.yoyItem].state)<0 ? ''rgba(40,167,69,0.15)'' : ''rgba(220,53,69,0.15)'''
                color: '=Number.parseFloat(items[props.yoyItem].state)<0 ? ''#28a745'' : ''#dc3545'''
      - component: Label
        config:
          text: '=(props.predictedItem && items[props.predictedItem] && items[props.predictedItem].state !== ''NULL'' && items[props.predictedItem].state !== ''UNDEF'') ? ''Forecast €''+Math.round(Number.parseFloat(items[props.predictedItem].state)) :
            '''''
          style:
            display: block
            font-size: 11px
            opacity: '0.75'
            margin-top: 4px
          visible: =props.predictedItem && items[props.predictedItem] && items[props.predictedItem].state !== 'NULL' && items[props.predictedItem].state !== 'UNDEF'
      - component: Label
        config:
          text: '=(props.prevTotalItem && items[props.prevTotalItem] && items[props.prevTotalItem].state !== ''NULL'' && items[props.prevTotalItem].state !== ''UNDEF'') ? ''Last year €''+Math.round(Number.parseFloat(items[props.prevTotalItem].state)) :
            '''''
          style:
            display: block
            font-size: 11px
            opacity: '0.75'
            margin-top: 2px
          visible: =props.prevTotalItem && items[props.prevTotalItem] && items[props.prevTotalItem].state !== 'NULL' && items[props.prevTotalItem].state !== 'UNDEF'
