uid: server_status_card
tags:
- system
- card
props:
  parameters:
  - name: title
    label: Title
    description: Card title (default Raspberry Pi).
    type: TEXT
    required: false
    default: Raspberry Pi
    groupName: general
  - name: modelItem
    label: Model item
    description: String item with the hardware name, e.g. Raspberry Pi 5 Model B.
    type: TEXT
    required: false
    context: item
    default: Systeminfo_CPUName
    groupName: general
  - name: uptimeItem
    label: Uptime item
    description: Number:Time item (days).
    type: TEXT
    required: false
    context: item
    default: Systeminfo_System_Uptime
    groupName: general
  - name: cpuLoadItem
    label: CPU load item
    description: Number (%) — ring.
    type: TEXT
    required: false
    context: item
    default: Systeminfo_CPULoad
    groupName: compute
  - name: cpuTempItem
    label: CPU temperature item
    description: Number:Temperature (°C); amber above 70, red above 80.
    type: TEXT
    required: false
    context: item
    default: Systeminfo_CPU_Temperature
    groupName: compute
  - name: load1Item
    label: Load average 1 min item
    description: Number.
    type: TEXT
    required: false
    context: item
    default: Systeminfo_Load1_Average
    groupName: compute
  - name: load15Item
    label: Load average 15 min item
    description: Number.
    type: TEXT
    required: false
    context: item
    default: Systeminfo_Load15_Average
    groupName: compute
  - name: memUsedPctItem
    label: Memory used % item
    description: Number (%) — ring.
    type: TEXT
    required: false
    context: item
    default: Systeminfo_Used_
    groupName: memory
  - name: memUsedItem
    label: Memory used item
    description: Number:DataAmount (bytes).
    type: TEXT
    required: false
    context: item
    default: Systeminfo_Used
    groupName: memory
  - name: memTotalItem
    label: Memory total item
    description: Number:DataAmount (bytes).
    type: TEXT
    required: false
    context: item
    default: Systeminfo_Total
    groupName: memory
  - name: swapUsedItem
    label: Swap used item
    description: Number:DataAmount (bytes).
    type: TEXT
    required: false
    context: item
    default: Systeminfo_SwapUsed
    groupName: memory
  - name: swapTotalItem
    label: Swap total item
    description: Number:DataAmount (bytes).
    type: TEXT
    required: false
    context: item
    default: Systeminfo_SwapTotal
    groupName: memory
  - name: storageUsedPctItem
    label: Storage used % item
    description: Number (%) — ring.
    type: TEXT
    required: false
    context: item
    default: Systeminfo_UsedStorage_
    groupName: storage
  - name: storageUsedItem
    label: Storage used item
    description: Number:DataAmount (bytes).
    type: TEXT
    required: false
    context: item
    default: Systeminfo_UsedStorage
    groupName: storage
  - name: storageTotalItem
    label: Storage total item
    description: Number:DataAmount (bytes).
    type: TEXT
    required: false
    context: item
    default: Systeminfo_Total_Storage
    groupName: storage
  - name: storageTitle
    label: SD card title
    description: Title of the first storage tile.
    type: TEXT
    required: false
    default: SD card
    groupName: storage
  - name: ssdPctItem
    label: SSD used % item
    description: Number (ratio or %) of the SSD volume — ring.
    type: TEXT
    required: false
    context: item
    default: Systeminfo_SSD_UsedPercent
    groupName: ssd
  - name: ssdUsedItem
    label: SSD used item
    description: Number:DataAmount.
    type: TEXT
    required: false
    context: item
    default: Systeminfo_SSD_Used
    groupName: ssd
  - name: ssdTotalItem
    label: SSD total item
    description: Number:DataAmount.
    type: TEXT
    required: false
    context: item
    default: Systeminfo_SSD_Total
    groupName: ssd
  - name: ssdTitle
    label: SSD title
    description: Title of the second storage tile.
    type: TEXT
    required: false
    default: SSD
    groupName: ssd
  - name: cpuFreqItem
    label: CPU frequency item
    description: Number:Frequency (Hz); shown next to the temperature.
    type: TEXT
    required: false
    context: item
    default: Systeminfo_CPU_Freq
    groupName: compute
  - name: heapPctItem
    label: Java heap used item
    description: Number (ratio or %) of the openHAB JVM heap — bar in the memory tile.
    type: TEXT
    required: false
    context: item
    default: Systeminfo_Used_Heap_Percent
    groupName: memory
  - name: procUsedItem
    label: openHAB process memory item
    description: Number:DataAmount used by the openHAB process.
    type: TEXT
    required: false
    context: item
    default: Systeminfo_CurrentProcessUsed
    groupName: memory
  - name: rxItem
    label: Data received item
    description: Number:DataAmount (bytes since boot).
    type: TEXT
    required: false
    context: item
    default: Systeminfo_Data_Received
    groupName: network
  - name: netNameItem
    label: Interface name item
    description: String item with the interface name (e.g. br0).
    type: TEXT
    required: false
    context: item
    default: Systeminfo_Net_Name
    groupName: network
  - name: netIpItem
    label: IP address item
    description: String item with the IP address.
    type: TEXT
    required: false
    context: item
    default: Systeminfo_Net_IP
    groupName: network
  - name: txItem
    label: Data sent item
    description: Number:DataAmount (bytes since boot).
    type: TEXT
    required: false
    context: item
    default: Systeminfo_Data_Sent
    groupName: network
  - name: rebootItem
    label: Reboot switch item
    description: Exec switch; ON reboots the server (with confirmation). Empty = no button.
    type: TEXT
    required: false
    context: item
    default: gSystem_Reboot
    groupName: controls
  - name: shutdownItem
    label: Shutdown switch item
    description: Exec switch; ON powers the server off (with confirmation). Empty = no button.
    type: TEXT
    required: false
    context: item
    default: gSystem_Shutdown
    groupName: controls
  parameterGroups:
  - name: general
    label: General
  - name: compute
    label: Compute
  - name: memory
    label: Memory
  - name: storage
    label: Storage (SD)
  - name: ssd
    label: Storage (SSD)
  - name: network
    label: Network
  - name: controls
    label: Controls
