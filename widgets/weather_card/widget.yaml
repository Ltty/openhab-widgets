uid: weather_card
tags:
- weather
- card
- outdoor
props:
  parameters:
  - name: tempItem
    label: Temperature item
    description: Current outdoor temperature.
    type: TEXT
    required: false
    context: item
    default: Netatmo_Weather_Station_Outdoor_Temperature
    groupName: current
  - name: conditionItem
    label: Condition item
    description: Condition text (String).
    type: TEXT
    required: false
    context: item
    default: OpenWeatherMap_Forecast_API_Current_Condition
    groupName: current
  - name: iconItem
    label: Icon id item
    description: OpenWeatherMap icon id of today (e.g. 03d); the night variant is picked from the trailing d/n.
    type: TEXT
    required: false
    context: item
    default: OpenWeatherMap_Forecast_API_Forecasts_ForecastToday_Iconid
    groupName: current
  - name: minItem
    label: Today min item
    description: Today's minimum temperature.
    type: TEXT
    required: false
    context: item
    default: OpenWeatherMap_Forecast_API_Forecasts_ForecastToday_Mintemperature
    groupName: current
  - name: maxItem
    label: Today max item
    description: Today's maximum temperature.
    type: TEXT
    required: false
    context: item
    default: OpenWeatherMap_Forecast_API_Forecasts_ForecastToday_Maxtemperature
    groupName: current
  - name: sunriseItem
    label: Sunrise item
    description: DateTime item.
    type: TEXT
    required: false
    context: item
    default: LocalSun_Rise_Start
    groupName: current
  - name: sunsetItem
    label: Sunset item
    description: DateTime item.
    type: TEXT
    required: false
    context: item
    default: LocalSun_Set_Start
    groupName: current
  - name: soilItem
    label: Soil temperature item
    description: Optional soil temperature, shown after min/max.
    type: TEXT
    required: false
    context: item
    default: Netatmo_Weather_Station_Soil_Temp
    groupName: current
  - name: updatedItem
    label: Last measurement item
    description: DateTime of the last station measurement.
    type: TEXT
    required: false
    context: item
    default: Netatmo_Weather_Station_Measures_Timestamp
    groupName: current
  - name: forecastPrefix
    label: Forecast item prefix
    description: 'Prefix of the OpenWeatherMap forecast items: <prefix>Hours01..06_Timestamp/_Iconid/_Temperature and <prefix>Today|Tomorrow|Day2..Day5_Iconid/_Mintemperature/_Maxtemperature.'
    type: TEXT
    required: false
    default: OpenWeatherMap_Forecast_API_Forecasts_Forecast
    groupName: forecast
  parameterGroups:
  - name: current
    label: Current weather
  - name: forecast
    label: Forecast
timestamp: Oct 5, 2026, 6:41:05 PM
component: f7-card
