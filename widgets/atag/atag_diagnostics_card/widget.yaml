      text: Device
      style:
        display: block
        margin: 18px 20px 6px
        font-size: 12px
        font-weight: '600'
        opacity: '0.7'
  - component: oh-list
    config:
      mediaList: true
      inset: true
      style:
        margin: 0 16px
        --f7-list-inset-border-radius: 18px
    slots:
      default:
      - component: oh-label-item
        config:
          visible: =!!props.serialNumber
          title: Serial Number
          after: =props.serialNumber
      - component: oh-label-item
        config:
          visible: =!!props.deviceId
          title: Device ID
          after: =props.deviceId
      - component: oh-label-item
        config:
