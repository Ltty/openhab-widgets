uid: air_quality_card
tags:
  - air-quality
  - card
props:
  parameters:
    - context: item
      description: Number item holding the computed European Air Quality Index band (1–6).
      groupName: computed
      label: EAQI Item
      name: eaqiItem
      required: true
      type: TEXT
    - context: item
      description: String item holding the EAQI category text (Good … Extremely poor).
      groupName: computed
      label: Category Item
      name: categoryItem
      required: true
      type: TEXT
    - context: item
      description: String item holding the name of the pollutant that set the overall index (PM2.5, PM10, NO2, O3 or SO2).
      groupName: computed
      label: Dominant Pollutant Item
      name: dominantItem
      required: true
      type: TEXT
    - context: item
      description: String item holding the one-sentence advice text for the current band.
      groupName: computed
      label: Advice Item
      name: adviceItem
      required: true
      type: TEXT
    - context: item
      description: DateTime item for when the reading was last measured.
      groupName: computed
      label: Timestamp Item
      name: timestampItem
      required: false
      type: TEXT
    - context: item
      description: Number:Density item for PM2.5, in µg/m³.
      groupName: pollutants
      label: PM2.5 Item
      name: pm25Item
      required: true
      type: TEXT
    - context: item
      description: Number:Density item for PM10, in µg/m³.
      groupName: pollutants
      label: PM10 Item
      name: pm10Item
      required: true
      type: TEXT
    - context: item
      description: Number:Density item for NO2, in µg/m³.
      groupName: pollutants
      label: NO2 Item
      name: no2Item
      required: true
      type: TEXT
    - context: item
      description: Number:Density item for O3, in µg/m³.
      groupName: pollutants
      label: O3 Item
      name: o3Item
      required: true
      type: TEXT
    - context: item
      description: Number:Density item for SO2, in µg/m³.
      groupName: pollutants
      label: SO2 Item
      name: so2Item
      required: true
      type: TEXT
    - description: Defaults to "Air Quality"
      groupName: appearance
      label: Title
      name: title
      required: false
      type: TEXT
    - description: Icon (e.g. f7:wind)
      groupName: appearance
      label: Icon
      name: icon
      required: false
      type: TEXT
  parameterGroups:
    - name: computed
      label: Computed Items
    - name: pollutants
      label: Pollutant Items
    - name: appearance
      label: Appearance
timestamp: Sep 3, 2026, 12:00:00 PM
component: f7-card
config:
  style:
    border-radius: 10px
    margin-left: 5px
    margin-right: 5px
slots:
  default:
    - component: f7-card-content
      config:
        style:
          padding: 12px 16px
      slots:
        default:
          # Header: icon + title + last-measured time
          - component: f7-row
            config:
              style:
                align-items: center
                margin: 0 0 6px
            slots:
              default:
                - component: oh-icon
                  config:
                    icon: "=props.icon || 'f7:wind'"
                    style:
                      flex: 0 0 auto
                      font-size: 18px
                      margin-right: 8px
                      opacity: "0.7"
                - component: f7-col
                  config:
                    style:
                      flex: "1"
                      font-size: 14px
                      font-weight: "500"
                      padding: "0"
                  slots:
                    default:
                      - component: Label
                        config:
                          text: "=props.title || 'Air Quality'"
                - component: f7-col
                  config:
                    style:
                      flex: 0 0 auto
                      font-size: 12px
                      opacity: "0.55"
                      padding: "0"
                      text-align: right
                  slots:
                    default:
                      - component: Label
                        config:
                          text: "=(props.timestampItem && items[props.timestampItem]) ? dayjs(items[props.timestampItem].state).format('HH:mm') : ''"

          # Big verdict: category text in its official EAQI band color
          - component: Label
            config:
              style:
                color: "=(v=>v<=1?'#1f9e94':v<=2?'#2f8f6f':v<=3?'#8a8000':v<=4?'#d13b3b':v<=5?'#960032':'#7D2181')(Number.parseFloat(items[props.eaqiItem] ? items[props.eaqiItem].state : '1'))"
                display: block
                font-size: 26px
                font-weight: "600"
                line-height: "1.1"
                margin: "0"
              text: "=items[props.categoryItem] ? items[props.categoryItem].state : '–'"

          # "Driven by X · Y µg/m³" subtitle
          - component: Label
            config:
              style:
                display: block
                font-size: 13px
                margin: 2px 0 10px
                opacity: "0.65"
              text: "=\"Driven by \" + (items[props.dominantItem] ? items[props.dominantItem].state : '–') + \" · \" + ((items[props.dominantItem] && items[props.dominantItem].state === 'PM2.5') ? Number.parseFloat(items[props.pm25Item].state).toFixed(1) : (items[props.dominantItem] && items[props.dominantItem].state === 'PM10') ? Number.parseFloat(items[props.pm10Item].state).toFixed(1) : (items[props.dominantItem] && items[props.dominantItem].state === 'NO2') ? Number.parseFloat(items[props.no2Item].state).toFixed(1) : (items[props.dominantItem] && items[props.dominantItem].state === 'O3') ? Number.parseFloat(items[props.o3Item].state).toFixed(1) : Number.parseFloat(items[props.so2Item].state).toFixed(1)) + \" µg/m³\""

          # Six-segment EAQI band strip — the active band renders taller
          - component: f7-row
            config:
              style:
                align-items: flex-end
                height: 14px
                margin: 0 0 10px
            slots:
              default:
                - component: Label
                  config:
                    text: " "
                    style:
                      background: "#50f0e6"
                      border-radius: 3px
                      display: block
                      flex: "1"
                      height: "=Number.parseFloat(items[props.eaqiItem] ? items[props.eaqiItem].state : '1') === 1 ? '14px' : '6px'"
                      margin: 0 2px 0 0
                - component: Label
                  config:
                    text: " "
                    style:
                      background: "#50ccaa"
                      border-radius: 3px
                      display: block
                      flex: "1"
                      height: "=Number.parseFloat(items[props.eaqiItem] ? items[props.eaqiItem].state : '1') === 2 ? '14px' : '6px'"
                      margin: 0 2px
                - component: Label
                  config:
                    text: " "
                    style:
                      background: "#f0e641"
                      border-radius: 3px
                      display: block
                      flex: "1"
                      height: "=Number.parseFloat(items[props.eaqiItem] ? items[props.eaqiItem].state : '1') === 3 ? '14px' : '6px'"
                      margin: 0 2px
                - component: Label
                  config:
                    text: " "
                    style:
                      background: "#ff5050"
                      border-radius: 3px
                      display: block
                      flex: "1"
                      height: "=Number.parseFloat(items[props.eaqiItem] ? items[props.eaqiItem].state : '1') === 4 ? '14px' : '6px'"
                      margin: 0 2px
                - component: Label
                  config:
                    text: " "
                    style:
                      background: "#960032"
                      border-radius: 3px
                      display: block
                      flex: "1"
                      height: "=Number.parseFloat(items[props.eaqiItem] ? items[props.eaqiItem].state : '1') === 5 ? '14px' : '6px'"
                      margin: 0 2px
                - component: Label
                  config:
                    text: " "
                    style:
                      background: "#7D2181"
                      border-radius: 3px
                      display: block
                      flex: "1"
                      height: "=Number.parseFloat(items[props.eaqiItem] ? items[props.eaqiItem].state : '1') === 6 ? '14px' : '6px'"
                      margin: 0 0 0 2px

          # Band labels under the strip
          - component: f7-row
            config:
              style:
                margin: 0 0 10px
            slots:
              default:
                - component: Label
                  config:
                    style:
                      flex: "1"
                      font-size: 9px
                      opacity: "0.5"
                      text-align: left
                    text: Good
                - component: Label
                  config:
                    style:
                      flex: "1"
                      font-size: 9px
                      opacity: "0.5"
                      text-align: right
                    text: Extremely poor

          # Advice sentence
          - component: Label
            config:
              style:
                display: block
                font-size: 13px
                margin: 0 0 8px
              text: "=items[props.adviceItem] ? items[props.adviceItem].state : ''"

          # Expandable per-pollutant detail
          - component: oh-list-card
            config:
              accordionList: true
              mediaList: true
              noBorder: true
              noShadow: true
              style:
                margin: "0"
            slots:
              default:
                - component: oh-list-item
                  config:
                    title: Pollutant detail
                    icon: f7:chevron_down
                  slots:
                    accordion:
                      - component: f7-list
                        config: {}
                        slots:
                          default:
                            - component: f7-list-item
                              config: {}
                              slots:
                                title:
                                  - component: Label
                                    config:
                                      text: PM2.5
                                      style:
                                        display: block
                                        font-size: 14px
                                        font-weight: "500"
                                        text-align: right
                                subtitle:
                                  - component: Label
                                    config:
                                      text: Fine particulate matter
                                      style:
                                        display: block
                                        font-size: 12px
                                        opacity: "0.55"
                                        text-align: right
                                after:
                                  - component: f7-row
                                    config:
                                      style:
                                        align-items: center
                                        justify-content: flex-end
                                    slots:
                                      default:
                                        - component: Label
                                          config:
                                            text: "=Number.parseFloat(items[props.pm25Item].state).toFixed(1) + ' µg/m³'"
                                            style:
                                              font-size: 13px
                                              margin-right: 8px
                                              opacity: "0.6"
                                        - component: Label
                                          config:
                                            text: "=(v=>v<=5?'Good':v<=15?'Fair':v<=50?'Moderate':v<=90?'Poor':v<=140?'Very poor':'Extremely poor')(Number.parseFloat(items[props.pm25Item].state))"
                                            style:
                                              background: "=(v=>v<=5?'#50f0e6':v<=15?'#50ccaa':v<=50?'#f0e641':v<=90?'#ff5050':v<=140?'#960032':'#7D2181')(Number.parseFloat(items[props.pm25Item].state))"
                                              border-radius: 10px
                                              color: "=(v=>v<=5?'black':v<=15?'white':v<=50?'black':v<=90?'white':v<=140?'white':'white')(Number.parseFloat(items[props.pm25Item].state))"
                                              font-size: 11px
                                              font-weight: "600"
                                              padding: 3px 10px
                                              white-space: nowrap
                            - component: f7-list-item
                              config: {}
                              slots:
                                title:
                                  - component: Label
                                    config:
                                      text: PM10
                                      style:
                                        display: block
                                        font-size: 14px
                                        font-weight: "500"
                                        text-align: right
                                subtitle:
                                  - component: Label
                                    config:
                                      text: Coarse particulate matter
                                      style:
                                        display: block
                                        font-size: 12px
                                        opacity: "0.55"
                                        text-align: right
                                after:
                                  - component: f7-row
                                    config:
                                      style:
                                        align-items: center
                                        justify-content: flex-end
                                    slots:
                                      default:
                                        - component: Label
                                          config:
                                            text: "=Number.parseFloat(items[props.pm10Item].state).toFixed(1) + ' µg/m³'"
                                            style:
                                              font-size: 13px
                                              margin-right: 8px
                                              opacity: "0.6"
                                        - component: Label
                                          config:
                                            text: "=(v=>v<=15?'Good':v<=45?'Fair':v<=120?'Moderate':v<=195?'Poor':v<=270?'Very poor':'Extremely poor')(Number.parseFloat(items[props.pm10Item].state))"
                                            style:
                                              background: "=(v=>v<=15?'#50f0e6':v<=45?'#50ccaa':v<=120?'#f0e641':v<=195?'#ff5050':v<=270?'#960032':'#7D2181')(Number.parseFloat(items[props.pm10Item].state))"
                                              border-radius: 10px
                                              color: "=(v=>v<=15?'black':v<=45?'white':v<=120?'black':v<=195?'white':v<=270?'white':'white')(Number.parseFloat(items[props.pm10Item].state))"
                                              font-size: 11px
                                              font-weight: "600"
                                              padding: 3px 10px
                                              white-space: nowrap
                            - component: f7-list-item
                              config: {}
                              slots:
                                title:
                                  - component: Label
                                    config:
                                      text: NO2
                                      style:
                                        display: block
                                        font-size: 14px
                                        font-weight: "500"
                                        text-align: right
                                subtitle:
                                  - component: Label
                                    config:
                                      text: Nitrogen dioxide
                                      style:
                                        display: block
                                        font-size: 12px
                                        opacity: "0.55"
                                        text-align: right
                                after:
                                  - component: f7-row
                                    config:
                                      style:
                                        align-items: center
                                        justify-content: flex-end
                                    slots:
                                      default:
                                        - component: Label
                                          config:
                                            text: "=Number.parseFloat(items[props.no2Item].state).toFixed(1) + ' µg/m³'"
                                            style:
                                              font-size: 13px
                                              margin-right: 8px
                                              opacity: "0.6"
                                        - component: Label
                                          config:
                                            text: "=(v=>v<=10?'Good':v<=25?'Fair':v<=60?'Moderate':v<=100?'Poor':v<=150?'Very poor':'Extremely poor')(Number.parseFloat(items[props.no2Item].state))"
                                            style:
                                              background: "=(v=>v<=10?'#50f0e6':v<=25?'#50ccaa':v<=60?'#f0e641':v<=100?'#ff5050':v<=150?'#960032':'#7D2181')(Number.parseFloat(items[props.no2Item].state))"
                                              border-radius: 10px
                                              color: "=(v=>v<=10?'black':v<=25?'white':v<=60?'black':v<=100?'white':v<=150?'white':'white')(Number.parseFloat(items[props.no2Item].state))"
                                              font-size: 11px
                                              font-weight: "600"
                                              padding: 3px 10px
                                              white-space: nowrap
                            - component: f7-list-item
                              config: {}
                              slots:
                                title:
                                  - component: Label
                                    config:
                                      text: O3
                                      style:
                                        display: block
                                        font-size: 14px
                                        font-weight: "500"
                                        text-align: right
                                subtitle:
                                  - component: Label
                                    config:
                                      text: Ozone
                                      style:
                                        display: block
                                        font-size: 12px
                                        opacity: "0.55"
                                        text-align: right
                                after:
                                  - component: f7-row
                                    config:
                                      style:
                                        align-items: center
                                        justify-content: flex-end
                                    slots:
                                      default:
                                        - component: Label
                                          config:
                                            text: "=Number.parseFloat(items[props.o3Item].state).toFixed(1) + ' µg/m³'"
                                            style:
                                              font-size: 13px
                                              margin-right: 8px
                                              opacity: "0.6"
                                        - component: Label
                                          config:
                                            text: "=(v=>v<=60?'Good':v<=100?'Fair':v<=120?'Moderate':v<=160?'Poor':v<=180?'Very poor':'Extremely poor')(Number.parseFloat(items[props.o3Item].state))"
                                            style:
                                              background: "=(v=>v<=60?'#50f0e6':v<=100?'#50ccaa':v<=120?'#f0e641':v<=160?'#ff5050':v<=180?'#960032':'#7D2181')(Number.parseFloat(items[props.o3Item].state))"
                                              border-radius: 10px
                                              color: "=(v=>v<=60?'black':v<=100?'white':v<=120?'black':v<=160?'white':v<=180?'white':'white')(Number.parseFloat(items[props.o3Item].state))"
                                              font-size: 11px
                                              font-weight: "600"
                                              padding: 3px 10px
                                              white-space: nowrap
                            - component: f7-list-item
                              config: {}
                              slots:
                                title:
                                  - component: Label
                                    config:
                                      text: SO2
                                      style:
                                        display: block
                                        font-size: 14px
                                        font-weight: "500"
                                        text-align: right
                                subtitle:
                                  - component: Label
                                    config:
                                      text: Sulphur dioxide
                                      style:
                                        display: block
                                        font-size: 12px
                                        opacity: "0.55"
                                        text-align: right
                                after:
                                  - component: f7-row
                                    config:
                                      style:
                                        align-items: center
                                        justify-content: flex-end
                                    slots:
                                      default:
                                        - component: Label
                                          config:
                                            text: "=Number.parseFloat(items[props.so2Item].state).toFixed(1) + ' µg/m³'"
                                            style:
                                              font-size: 13px
                                              margin-right: 8px
                                              opacity: "0.6"
                                        - component: Label
                                          config:
                                            text: "=(v=>v<=20?'Good':v<=40?'Fair':v<=125?'Moderate':v<=190?'Poor':v<=275?'Very poor':'Extremely poor')(Number.parseFloat(items[props.so2Item].state))"
                                            style:
                                              background: "=(v=>v<=20?'#50f0e6':v<=40?'#50ccaa':v<=125?'#f0e641':v<=190?'#ff5050':v<=275?'#960032':'#7D2181')(Number.parseFloat(items[props.so2Item].state))"
                                              border-radius: 10px
                                              color: "=(v=>v<=20?'black':v<=40?'white':v<=125?'black':v<=190?'white':v<=275?'white':'white')(Number.parseFloat(items[props.so2Item].state))"
                                              font-size: 11px
                                              font-weight: "600"
                                              padding: 3px 10px
                                              white-space: nowrap
