          title: Boiler Return Temp
      - component: oh-label-item
        config:
          item: =props.deltaTempItem
          title: Delta Temperature
      - component: oh-label-item
        config:
          item: =props.timeToTargetItem
          title: Time to Target
      - component: oh-label-item
        config:
          item: =props.averageOutsideTempItem
          title: Average Outside Temp
      - component: oh-label-item
        config:
          item: =props.weatherStatusItem
          title: Weather Status
  - component: Label
    config:
