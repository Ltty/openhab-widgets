        --f7-list-inset-border-radius: 18px
    slots:
      default:
      - component: oh-label-item
        config:
          item: =props.waterPressureItem
          title: CH Water Pressure
      - component: oh-label-item
        config:
          item: =props.modulationLevelItem
          title: Modulation Level
      - component: oh-label-item
        config:
