uid: humidity_room_card
tags:
- humidity
- card
props:
  parameters:
  - context: item
    description: Humidity item (0–100 % or 0–1 ratio) — drives the value, status pill and zone bar.
    label: Humidity Item
    name: item
    required: true
    type: TEXT
    groupName: sensor
  - context: item
    description: Temperature item — shown in the sub line.
    label: Temperature Item
    name: tempItem
    required: false
    type: TEXT
    groupName: sensor
  - context: item
    description: Thermostat setpoint item — shown as "Set X °C" in the sub line.
    label: Setpoint Item
    name: setpointItem
    required: false
    type: TEXT
    groupName: sensor
  - description: Defaults to item label
    label: Room Name
    name: title
    required: false
    type: TEXT
    groupName: appearance
  - description: Icon (e.g. iconify:mdi:sofa)
    label: Icon
    name: icon
    required: false
    type: TEXT
    groupName: appearance
  - default: '40'
    label: Safe Min (%)
    name: min
    required: false
    type: INTEGER
    min: 0
    max: 100
    groupName: thresholds
  - default: '60'
    label: Elevated max (%)
    name: orange
    required: false
    type: INTEGER
    min: 0
    max: 100
    groupName: thresholds
  - default: '70'
    label: Critical from (%)
    name: red
    required: false
    type: INTEGER
    min: 0
    max: 100
    groupName: thresholds
  - context: item
    description: Comma-separated heating valve switch items. Shows a valve icon in the header — blue when any valve is open, dim when all are closed.
    label: Valve Item(s)
    name: valveItems
    required: false
    type: TEXT
    groupName: extras
  parameterGroups:
  - name: sensor
    label: Sensor Items
  - name: appearance
    label: Appearance
  - name: thresholds
    label: Thresholds
  - name: extras
    label: Valve
timestamp: Oct 5, 2026, 6:34:27 PM
component: oh-link
config:
  action: analyzer
  actionAnalyzerItems: '=props.item + (props.tempItem ? '','' + props.tempItem : '''') + (props.setpointItem ? '','' + props.setpointItem : '''') + (props.valveItems ? '','' + props.valveItems : '''')'
  style:
    color: inherit
    display: block
    text-decoration: none
slots:
  default:
  - component: f7-card
    config:
      style:
        margin: '0'
        border-radius: 18px
        min-width: '0'
    slots:
      default:
      - component: f7-card-content
        config:
          style:
            padding: 14px 14px 12px
        slots:
          default:
          - component: f7-row
            config:
              style:
                display: flex
                align-items: center
                justify-content: flex-start
                gap: 6px
                margin: '0'
            slots:
              default:
              - component: oh-icon
                config:
                  icon: =props.icon || 'f7:house'
                  style:
                    font-size: 16px
                    opacity: '0.75'
              - component: Label
                config:
                  text: '=props.title || (items[props.item] ? items[props.item].label : '''')'
                  style:
                    font-size: 12px
                    opacity: '0.7'
                    flex: '1'
                    white-space: nowrap
                    overflow: hidden
                    text-overflow: ellipsis
              - component: oh-repeater
                config:
                  for: v
                  sourceType: array
                  in: '=(props.valveItems||'''').split('','').map(s=>s.trim()).filter(s=>!!s).length > 0 ? [1] : []'
                  fragment: true
                slots:
                  default:
                  - component: oh-icon
                    config:
                      icon: '=(props.valveItems||'''').split('','').map(s=>s.trim()).filter(s=>!!s).some(n=>items[n]&&items[n].state===''ON'') ? ''iconify:mdi:valve-open'' : ''iconify:mdi:valve-closed'''
                      style:
                        font-size: 15px
                        color: '=(props.valveItems||'''').split('','').map(s=>s.trim()).filter(s=>!!s).some(n=>items[n]&&items[n].state===''ON'') ? ''#0ea5e9'' : ''inherit'''
                        opacity: '=(props.valveItems||'''').split('','').map(s=>s.trim()).filter(s=>!!s).some(n=>items[n]&&items[n].state===''ON'') ? ''1'' : ''0.35'''
          - component: f7-row
            config:
              style:
                display: flex
                align-items: baseline
                justify-content: flex-start
                gap: 6px
                margin: 6px 0 0
            slots:
              default:
              - component: Label
                config:
                  text: '=(props.item && items[props.item] && items[props.item].state !== ''NULL'' && items[props.item].state !== ''UNDEF'') ? Math.round((v=>v<=1 ? v*100 : v)(Number.parseFloat(items[props.item].state))) : ''–'''
                  style:
                    font-size: 26px
                    font-weight: '700'
                    line-height: '1.1'
              - component: Label
                config:
                  text: '%'
                  style:
                    font-size: 12px
                    opacity: '0.75'
          - component: f7-row
            config:
              style:
                display: flex
                justify-content: flex-start
                margin: 4px 0 0
            slots:
              default:
              - component: Label
                config:
                  text: '=[''OK'',''Elevated'',''Critical''][(h=>h > (props.red || 70) ? 2 : h > (props.orange || 60) ? 1 : 0)((v=>v<=1 ? v*100 : v)(Number.parseFloat(items[props.item].state)))]'
                  style:
                    border-radius: 12px
                    font-size: 12px
                    font-weight: '500'
                    padding: 1px 8px
                    background: '=[''rgba(40,167,69,0.15)'',''rgba(255,159,10,0.18)'',''rgba(220,53,69,0.15)''][(h=>h > (props.red || 70) ? 2 : h > (props.orange || 60) ? 1 : 0)((v=>v<=1 ? v*100 : v)(Number.parseFloat(items[props.item].state)))]'
                    color: '=[''#28a745'',''#d98200'',''#dc3545''][(h=>h > (props.red || 70) ? 2 : h > (props.orange || 60) ? 1 : 0)((v=>v<=1 ? v*100 : v)(Number.parseFloat(items[props.item].state)))]'
          - component: f7-row
            config:
              style:
                display: block
                position: relative
                height: 6px
                border-radius: 3px
                margin: 10px 0 0
                background: '=''linear-gradient(90deg, #28a745 0%, #28a745 ''+(((props.orange || 60) - (props.min || 40)) / (100 - (props.min || 40)) * 100)+''%, #f59e0b ''+(((props.orange || 60) - (props.min || 40)) / (100 - (props.min || 40)) * 100)+''%,
                  #f59e0b ''+(((props.red || 70) - (props.min || 40)) / (100 - (props.min || 40)) * 100)+''%, #dc3545 ''+(((props.red || 70) - (props.min || 40)) / (100 - (props.min || 40)) * 100)+''%, #dc3545 100%)'''
            slots:
              default:
              - component: f7-row
                config:
                  style:
                    position: absolute
                    top: -3px
                    width: 3px
                    height: 12px
                    margin: '0'
                    border-radius: 2px
                    background: var(--f7-card-bg-color)
                    box-shadow: 0 0 0 1px rgba(128,128,128,0.6)
                    left: '=(Math.max(0, Math.min(100, (((v=>v<=1 ? v*100 : v)(Number.parseFloat(items[props.item].state))) - (props.min || 40)) / (100 - (props.min || 40)) * 100)))+''%'''
          - component: f7-row
            config:
              style:
                display: flex
                align-items: center
                justify-content: space-between
                margin: 10px 0 0
            slots:
              default:
              - component: f7-row
                config:
                  style:
                    display: inline-flex
                    align-items: center
                    gap: 4px
                    margin: '0'
                slots:
                  default:
                  - component: oh-icon
                    config:
                      icon: f7:thermometer
                      style:
                        font-size: 14px
                        opacity: '0.7'
                  - component: Label
                    config:
                      text: '=(props.tempItem && items[props.tempItem] && items[props.tempItem].state !== ''NULL'') ? Number.parseFloat(items[props.tempItem].state).toFixed(1)+''°'' : ''–'''
                      style:
                        font-size: 13px
                        font-weight: '600'
              - component: Label
                config:
                  text: '=(props.setpointItem && items[props.setpointItem] && items[props.setpointItem].state !== ''NULL'') ? ''Set ''+Number.parseFloat(items[props.setpointItem].state).toFixed(0)+''°'' : '''''
                  style:
                    font-size: 11px
                    opacity: '0.65'
