<!DOCTYPE html><html><head>
<meta charset="utf-8">
<style>
:root {
  --bg: #1c1c1e;
  --text: rgba(255,255,255,0.9);
  --muted: rgba(255,255,255,0.38);
  --divider: rgba(255,255,255,0.08);
  --accent: #007AFF;
  --good: #34C759;
  --warn: #FF9F0A;
  --bad: #FF453A;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  overflow: hidden; }
.card { padding: 14px 16px; }

.main-row { display: flex; margin-bottom: 10px; }
.metric { flex: 1; text-align: center; position: relative; overflow: hidden; padding: 4px 0; }
.sparkline { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0.35; pointer-events: none; }
.m-dir { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px;
         color: var(--muted); margin-bottom: 3px;
         display: flex; align-items: center; justify-content: center; gap: 4px; }
.m-val { font-size: 2.25em; font-weight: 700; line-height: 1; transition: color .3s; position: relative; }
.m-unit { font-size: 10px; color: var(--muted); margin: 1px 0 3px; position: relative; }
.m-plan { font-size: 10px; min-height: 13px; position: relative; }
.divider-v { width: 1px; background: var(--divider); align-self: stretch; margin: 4px 8px; }

.ping-row { display: flex; justify-content: center; gap: 28px;
            padding: 8px 0; border-top: 1px solid var(--divider);
            border-bottom: 1px solid var(--divider); margin-bottom: 10px; }
.pm { text-align: center; }
.pv { font-size: 1.0em; font-weight: 600; }
.pl { font-size: 10px; color: var(--muted); margin-top: 2px;
      display: flex; align-items: center; justify-content: center; gap: 3px; }

.qual-row { display: flex; justify-content: space-around; margin-bottom: 9px; }
.qi { flex: 1; text-align: center; }
.qi-icon { font-size: 18px; display: block; margin-bottom: 3px; }
.dots { display: flex; justify-content: center; gap: 3px; margin-bottom: 3px; }
.dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.1); }
.dot.g { background: var(--good); }
.dot.w { background: var(--warn); }
.dot.b { background: var(--bad); }
.ql { font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.3px; }

.ts { text-align: center; font-size: 10px; color: var(--muted); margin-bottom: 9px; }
.run-btn { width: 100%; padding: 10px 0; background: var(--accent); color: #fff;
           border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; }
.run-btn:active { opacity: 0.75; }
.run-btn:disabled { opacity: 0.45; cursor: default; }
.mi { width: 11px; height: 11px; flex-shrink: 0; }
</style>
</head>
<body>
<div class="card">
  <div class="main-row">
    <div class="metric">
      <svg class="sparkline" id="spark-dl" viewBox="0 0 100 60" preserveAspectRatio="none"></svg>
      <div class="m-dir">
        <svg class="mi" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <line x1="6" y1="1.5" x2="6" y2="8.5"/><polyline points="3.5,6.5 6,9 8.5,6.5"/>
          <line x1="1.5" y1="10.5" x2="10.5" y2="10.5"/>
        </svg>
        Download
      </div>
      <div class="m-val" id="dl">—</div>
      <div class="m-unit">Mbit/s</div>
      <div class="m-plan" id="dl-plan"></div>
    </div>
    <div class="divider-v"></div>
    <div class="metric">
      <svg class="sparkline" id="spark-ul" viewBox="0 0 100 60" preserveAspectRatio="none"></svg>
      <div class="m-dir">
        <svg class="mi" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <line x1="6" y1="10.5" x2="6" y2="3.5"/><polyline points="3.5,5.5 6,3 8.5,5.5"/>
          <line x1="1.5" y1="1.5" x2="10.5" y2="1.5"/>
        </svg>
        Upload
      </div>
      <div class="m-val" id="ul">—</div>
      <div class="m-unit">Mbit/s</div>
      <div class="m-plan" id="ul-plan"></div>
    </div>
  </div>

  <div class="ping-row">
    <div class="pm">
      <div class="pv" id="ping">—</div>
      <div class="pl">
        <svg class="mi" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
          <circle cx="6" cy="9" r="1" fill="currentColor" stroke="none"/>
          <path d="M3.8,7a3.1,3.1 0 0,1 4.4,0"/>
          <path d="M1.5,4.8a6.4,6.4 0 0,1 9,0"/>
        </svg>
        Ping ms
      </div>
    </div>
    <div class="pm">
      <div class="pv" id="jitter">—</div>
      <div class="pl">
        <svg class="mi" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="0.5,6 2,3.5 4,8.5 6,3.5 8,8.5 10,3.5 11.5,6"/>
        </svg>
        Jitter ms
      </div>
    </div>
  </div>

  <div class="qual-row">
    <div class="qi"><span class="qi-icon">🖥</span><div class="dots" id="q-web"></div><div class="ql">Browsing</div></div>
    <div class="qi"><span class="qi-icon">🎮</span><div class="dots" id="q-game"></div><div class="ql">Gaming</div></div>
    <div class="qi"><span class="qi-icon">📺</span><div class="dots" id="q-stream"></div><div class="ql">Streaming</div></div>
    <div class="qi"><span class="qi-icon">📹</span><div class="dots" id="q-video"></div><div class="ql">Video Call</div></div>
  </div>

  <div class="ts" id="ts"></div>
  <button class="run-btn" id="btn" onclick="runTest()">Run Test Again</button>
</div>
<script>
const _p = new URLSearchParams(location.search);
const PLAN_D = parseFloat(_p.get('planDown')) || 150;
const PLAN_U = parseFloat(_p.get('planUp')) || 20;
const ITEM_DL  = _p.get('dl')  || 'SpeedtestResultDown';
const ITEM_UL  = _p.get('ul')  || 'SpeedtestResultUp';
const ITEM_PG  = _p.get('pg')  || 'SpeedtestResultPing';
const ITEM_JT  = _p.get('jt')  || 'SpeedtestResultJitter';
const ITEM_DT  = _p.get('dt')  || 'SpeedtestResultDate';
const ITEM_SV  = _p.get('sv')  || 'SpeedtestServer';
const ITEM_RUN = _p.get('run') || 'SpeedtestRerun';
const SERVICE_ID = _p.get('serviceId') || '';

function scoreColor(s) { return s >= 4 ? 'g' : s >= 2 ? 'w' : 'b'; }
function renderDots(id, score) {
  const c = scoreColor(score);
  document.getElementById(id).innerHTML =
    Array.from({length:5}, (_,i) => `<div class="dot${i<score?' '+c:''}"></div>`).join('');
}
function webScore(d)    { return d>=100?5:d>=50?4:d>=25?3:d>=10?2:d>=5?1:0; }
function gameScore(p)   { return p<=20?5:p<=30?4:p<=50?3:p<=100?2:p<=150?1:0; }
function streamScore(d) { return d>=50?5:d>=25?4:d>=15?3:d>=5?2:d>=3?1:0; }
function videoScore(u)  { return u>=20?5:u>=10?4:u>=5?3:u>=2?2:u>=1?1:0; }

function timeAgo(iso) {
  if (!iso || iso==='NULL'||iso==='UNDEF') return '';
  const m = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
  return m < 1 ? 'just now' : m < 60 ? m + ' min ago' : Math.round(m/60) + ' h ago';
}

async function getItem(name) {
  return (await fetch('/rest/items/' + name, {credentials:'include'})).json();
}

async function getHistory(item) {
  const start = new Date(Date.now() - 7*24*60*60*1000).toISOString();
  try {
    const r = await fetch('/rest/persistence/items/' + item +
      '?starttime=' + encodeURIComponent(start) + (SERVICE_ID ? '&serviceId=' + encodeURIComponent(SERVICE_ID) : ''), {credentials:'include'});
    const d = await r.json();
    return (d.data || []).map(e => parseFloat(e.state)).filter(v => !isNaN(v) && v > 0);
  } catch(e) { return []; }
}

function downsample(pts, n) {
  if (pts.length <= n) return pts;
  const sz = Math.ceil(pts.length / n), out = [];
  for (let i = 0; i < pts.length; i += sz) {
    const chunk = pts.slice(i, i + sz);
    out.push(chunk.reduce((a, b) => a + b, 0) / chunk.length);
  }
  return out;
}

function renderSparkline(svgId, pts, planVal, color) {
  const el = document.getElementById(svgId);
  if (!el || pts.length < 2) return;
  const W = 100, H = 60;
  const sampled = downsample(pts, 14);
  const maxV = Math.max(Math.max(...sampled), planVal) * 1.05;
  const minV = Math.min(...sampled) * 0.85;
  const x = i => (i / (sampled.length - 1)) * W;
  const y = v => H - ((v - minV) / (maxV - minV)) * H;
  const coords = sampled.map((v, i) => [x(i), y(v)]);
  // smooth cubic bezier through midpoints
  let d = 'M ' + coords[0][0].toFixed(1) + ',' + coords[0][1].toFixed(1);
  for (let i = 1; i < coords.length; i++) {
    const [x0, y0] = coords[i-1], [x1, y1] = coords[i];
    const mx = ((x0 + x1) / 2).toFixed(1);
    d += ' C ' + mx + ',' + y0.toFixed(1) + ' ' + mx + ',' + y1.toFixed(1) + ' ' + x1.toFixed(1) + ',' + y1.toFixed(1);
  }
  const planY = y(planVal).toFixed(1);
  el.innerHTML =
    '<path d="' + d + '" fill="none" stroke="' + color + '" stroke-width="1.5" stroke-linecap="round" vector-effect="non-scaling-stroke"/>' +
    '<line x1="0" y1="' + planY + '" x2="' + W + '" y2="' + planY + '" stroke="' + color + '" stroke-width="0.8" stroke-dasharray="3,2" opacity="0.5" vector-effect="non-scaling-stroke"/>';
}

async function refresh() {
  try {
    const [dl, ul, pg, jt, sv, ts, dlH, ulH] = await Promise.all([
      getItem(ITEM_DL), getItem(ITEM_UL),
      getItem(ITEM_PG), getItem(ITEM_JT),
      getItem(ITEM_SV), getItem(ITEM_DT),
      getHistory(ITEM_DL), getHistory(ITEM_UL)
    ]);
    const d = parseFloat(dl.state), u = parseFloat(ul.state);
    const p = parseFloat(pg.state), j = parseFloat(jt.state) * 1000;

    document.getElementById('dl').textContent     = isNaN(d) ? '—' : d.toFixed(1);
    document.getElementById('ul').textContent     = isNaN(u) ? '—' : u.toFixed(1);
    document.getElementById('ping').textContent   = isNaN(p) ? '—' : p.toFixed(1);
    document.getElementById('jitter').textContent = isNaN(j) ? '—' : j.toFixed(1);

    const dlPct = Math.round(d / PLAN_D * 100), ulPct = Math.round(u / PLAN_U * 100);
    const dlPE = document.getElementById('dl-plan'), ulPE = document.getElementById('ul-plan');
    if (isNaN(d) || dlPct >= 100) { dlPE.textContent = ''; dlPE.style.color = ''; }
    else { dlPE.textContent = '-' + (100-dlPct) + '% below plan'; dlPE.style.color = dlPct < 80 ? 'var(--bad)' : 'var(--warn)'; }
    if (isNaN(u) || ulPct >= 100) { ulPE.textContent = ''; ulPE.style.color = ''; }
    else { ulPE.textContent = '-' + (100-ulPct) + '% below plan'; ulPE.style.color = ulPct < 80 ? 'var(--bad)' : 'var(--warn)'; }

    document.getElementById('dl').style.color = isNaN(d) ? '' :
      d >= PLAN_D*.8 ? '' : d >= PLAN_D*.6 ? 'var(--warn)' : 'var(--bad)';
    document.getElementById('ul').style.color = isNaN(u) ? '' :
      u >= PLAN_U*.8 ? '' : u >= PLAN_U*.6 ? 'var(--warn)' : 'var(--bad)';

    if (!isNaN(d)) { renderDots('q-web', webScore(d)); renderDots('q-stream', streamScore(d)); }
    if (!isNaN(p)) renderDots('q-game', gameScore(p));
    if (!isNaN(u)) renderDots('q-video', videoScore(u));

    renderSparkline('spark-dl', dlH, PLAN_D, '#30D158');
    renderSparkline('spark-ul', ulH, PLAN_U, '#BF5AF2');

    const srv = (sv.state && sv.state !== 'NULL' && sv.state !== 'UNDEF') ? sv.state : '';
    document.getElementById('ts').textContent = [srv, timeAgo(ts.state)].filter(Boolean).join(' · ');
  } catch(e) { console.error('speedtest:', e); }
}

async function runTest() {
  const btn = document.getElementById('btn');
  btn.disabled = true; btn.textContent = 'Running…';
  try {
    const xsrf = (document.cookie.split('; ').find(r => r.startsWith('XSRF-TOKEN=')) || '').split('=')[1] || '';
    const res = await fetch('/rest/items/' + ITEM_RUN, {
      method: 'POST', credentials: 'include', body: 'ON',
      headers: {'Content-Type':'text/plain', 'X-XSRF-TOKEN': xsrf}
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    let n = 0;
    const iv = setInterval(async () => {
      if (++n >= 18) { clearInterval(iv); reset(); return; }
      try { const r = await getItem(ITEM_RUN); if (r.state === 'OFF') { clearInterval(iv); await refresh(); reset(); } } catch(e) {}
    }, 5000);
  } catch(e) { reset(); }
  function reset() { btn.disabled = false; btn.textContent = 'Run Test Again'; }
}

try {
  const s = window.parent.getComputedStyle(window.parent.document.documentElement);
  const ac = s.getPropertyValue('--f7-theme-color').trim();
  if (ac) document.documentElement.style.setProperty('--accent', ac);
  const bg = s.getPropertyValue('--f7-card-bg-color').trim();
  if (bg) document.documentElement.style.setProperty('--bg', bg);
} catch(e) {}

refresh();
setInterval(refresh, 300000);
</script>
</body></html>
