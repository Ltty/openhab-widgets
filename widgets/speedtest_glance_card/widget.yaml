uid: speedtest_glance_card
tags:
- home
- network
- card
props:
  parameters:
  - name: downloadItem
    label: Download item
    description: Number:DataTransferRate item (Mbit/s) with the last download speed.
    type: TEXT
    required: true
    context: item
    groupName: items
  - name: uploadItem
    label: Upload item
    description: Number:DataTransferRate item (Mbit/s) with the last upload speed.
    type: TEXT
    required: true
    context: item
    groupName: items
  - name: pingItem
    label: Ping item
    description: Number:Time item (ms).
    type: TEXT
    required: false
    context: item
    groupName: items
  - name: jitterItem
    label: Jitter item
    description: Number:Time item; the binding reports seconds, shown in ms.
    type: TEXT
    required: false
    context: item
    groupName: items
  - name: dateItem
    label: Test time item
    description: DateTime item with the time of the last test.
    type: TEXT
    required: false
    context: item
    groupName: items
  - name: triggerItem
    label: Run-test switch item
    description: Switch item that starts a new test (ON); shows 'Running…' while ON. Empty = no refresh icon.
    type: TEXT
    required: false
    context: item
    groupName: items
  - name: planDown
    label: Plan download (Mbit/s)
    description: Contracted download speed; the pill compares against it.
    type: INTEGER
    required: false
    default: '150'
    groupName: plan
  - name: planUp
    label: Plan upload (Mbit/s)
    description: Contracted upload speed.
    type: INTEGER
    required: false
    default: '20'
    groupName: plan
  - name: title
    label: Title
    description: Title of the connection card.
    type: TEXT
    required: false
    default: Internet
    groupName: look
  - name: page
    label: Target page
    description: Page opened when a speed tile is tapped (e.g. page:page_abc).
    type: TEXT
    required: false
    context: page
    groupName: look
  parameterGroups:
  - name: items
    label: Speedtest items
  - name: plan
    label: Plan
  - name: look
    label: Look
