<!DOCTYPE html><html><head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <style>
    html, body { height: 100%; margin: 0; padding: 0; background: #1a1a2e; overflow: hidden; }
    #map { width: 100%; height: 100vh; }
    #msg { position: absolute; inset: 0; display: flex; align-items: center;
           justify-content: center; color: #666; font: 13px/1 sans-serif; }
    .leaflet-control-attribution { display: none; }
    #status-overlay {
      position: absolute; top: 10px; right: 10px;
      background: rgba(26,26,46,0.85); border: 1px solid rgba(255,255,255,0.15);
      color: #e0e0e0; padding: 6px 12px; border-radius: 6px;
      font-size: 11px; line-height: 1.4; z-index: 999;
      pointer-events: none; backdrop-filter: blur(4px); display: none;
    }
  </style>
</head><body>
  <div id="map"></div><div id="msg">Loading track…</div>
  <div id="status-overlay"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    var params    = new URLSearchParams(window.location.search);
    var itemName  = params.get('item') || '';
    var serviceId = params.get('serviceId') || '';

    var map      = null;
    var marker   = null;
    var polyline = null;
    var path     = [];

    var MOWER_ICON = L.divIcon({
      html: '<svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 26 26"' +
            ' style="filter:drop-shadow(0 2px 5px rgba(0,0,0,0.7))">' +
            '<circle cx="5"  cy="5"  r="3.2" fill="#222" stroke="#fff" stroke-width="1.2"/>' +
            '<circle cx="21" cy="5"  r="3.2" fill="#222" stroke="#fff" stroke-width="1.2"/>' +
            '<circle cx="5"  cy="21" r="3.2" fill="#222" stroke="#fff" stroke-width="1.2"/>' +
            '<circle cx="21" cy="21" r="3.2" fill="#222" stroke="#fff" stroke-width="1.2"/>' +
            '<rect x="5" y="5" width="16" height="16" rx="3" fill="#4CAF50" stroke="#fff" stroke-width="1.5"/>' +
            '<circle cx="13" cy="13" r="3.5" fill="rgba(255,255,255,0.25)" stroke="rgba(255,255,255,0.6)" stroke-width="1"/>' +
            '</svg>',
      className: '', iconSize: [26,26], iconAnchor: [13,13]
    });

    function initMap(lat, lon) {
      document.getElementById('msg').style.display = 'none';
      if (map) return;
      map = L.map('map', {zoomControl:false, attributionControl:false}).setView([lat,lon], 19);
      L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
        {maxZoom:21, maxNativeZoom:19}).addTo(map);
      window.addEventListener('resize', function() { map.invalidateSize(); });
      setTimeout(function() { map.invalidateSize(); }, 200);
    }

    function updateOverlay(lat, lon) {
      var overlay = document.getElementById('status-overlay');
      var now = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', second:'2-digit'});
      overlay.innerHTML = lat.toFixed(6) + ', ' + lon.toFixed(6) +
                          '<br><span style="color:#888;">Updated: ' + now + '</span>';
      overlay.style.display = 'block';
    }

    function redraw() {
      if (!map || path.length === 0) return;
      var last = path[path.length-1];
      if (polyline) map.removeLayer(polyline);
      if (path.length > 1)
        polyline = L.polyline(path, {color:'#FF6B35', weight:3, opacity:0.9, lineJoin:'round'}).addTo(map);
      if (marker) map.removeLayer(marker);
      marker = L.marker([last[0], last[1]], {icon:MOWER_ICON}).addTo(map);
      updateOverlay(last[0], last[1]);
    }

    function parseState(text) {
      if (!text || text === 'NULL' || text === 'UNDEF') return null;
      var parts = text.trim().split(',');
      if (parts.length < 2) return null;
      var lat = parseFloat(parts[0]), lon = parseFloat(parts[1]);
      return isNaN(lat) || isNaN(lon) ? null : [lat, lon];
    }

    function todayMidnightISO() {
      var d = new Date(); d.setHours(0,0,0,0); return d.toISOString();
    }

    function fetchHistory() {
      if (!itemName) return;
      var url = '/rest/persistence/items/' + itemName +
                '?starttime=' + encodeURIComponent(todayMidnightISO()) +
                '&boundary=false' +
                (serviceId ? '&serviceId=' + encodeURIComponent(serviceId) : '');
      fetch(url)
        .then(function(r) { return r.ok ? r.json() : Promise.reject(r.status); })
        .then(function(data) {
          var pts = (data.data || []).map(function(d) { return parseState(d.state); })
                                     .filter(function(p) { return p !== null; });
          if (pts.length === 0) {
            document.getElementById('msg').textContent = 'No movement recorded today';
            fetchPosition();
            return;
          }
          path = pts;
          var last = path[path.length-1];
          initMap(last[0], last[1]);
          redraw();
          map.fitBounds(L.polyline(path).getBounds(), {padding:[20,20], maxZoom:19});
        })
        .catch(function() { fetchPosition(); });
    }

    function fetchPosition() {
      if (!itemName) return;
      fetch('/rest/items/' + itemName + '/state', {headers:{Accept:'text/plain'}})
        .then(function(r) { return r.ok ? r.text() : Promise.reject(r.status); })
        .then(function(text) {
          var pos = parseState(text);
          if (!pos) return;
          initMap(pos[0], pos[1]);
          var last = path[path.length-1];
          var moved = !last || Math.abs(last[0]-pos[0]) > 0.000005 || Math.abs(last[1]-pos[1]) > 0.000005;
          if (!moved) return;
          path.push(pos);
          redraw();
          map.panTo([pos[0], pos[1]]);
        })
        .catch(function() {});
    }

    fetchHistory();
    setInterval(fetchPosition, 30000);
  </script>
</body></html>
