                    display: block
                    font-size: 14px
                    font-weight: '600'
                    line-height: '1.2'
              - component: Label
                config:
                  text: '=(props.modelItem && items[props.modelItem] && items[props.modelItem].state !== ''NULL'' && items[props.modelItem].state !== ''UNDEF'') ? items[props.modelItem].state : '''''
                  style:
                    display: block
