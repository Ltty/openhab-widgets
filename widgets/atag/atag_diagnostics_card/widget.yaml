      - component: oh-label-item
        config:
          item: =props.pcbTempItem
          title: PCB Temperature
      - component: oh-label-item
        config:
          item: =props.voltageItem
          title: Voltage
      - component: oh-label-item
        config:
          item: =props.wifiSignalItem
          title: WiFi Signal
      - component: oh-label-item
        config:
          item: =props.resetsItem
          title: Resets
      - component: oh-label-item
        config:
          item: =props.reportTimeItem
          title: Last Report
