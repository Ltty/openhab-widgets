uid: speedtest_card
tags: []
props:
  parameters:
  - context: item
    description: Number item linked to the Speedtest binding's download result channel.
      Drives the large download speed number and 7-day sparkline.
    label: Download Item
    name: downloadItem
    required: true
    type: TEXT
    groupName: binding
  - context: item
    description: Number item linked to the Speedtest binding's upload result channel.
      Drives the large upload speed number and 7-day sparkline.
    label: Upload Item
    name: uploadItem
    required: true
    type: TEXT
    groupName: binding
  - context: item
    description: Switch item linked to the binding's run channel. The "Run Test Again"
      button sends ON to this item and waits for it to reset to OFF.
    label: Trigger Item
    name: triggerItem
    required: true
    type: TEXT
    groupName: binding
  - context: item
    description: Number item for ping/latency in milliseconds. Shown in the ping row.
    label: Ping Item
    name: pingItem
    required: false
    type: TEXT
    groupName: binding
  - context: item
    description: Number item for jitter in seconds — the widget multiplies by 1000
      to display in milliseconds.
    label: Jitter Item
    name: jitterItem
    required: false
    type: TEXT
    groupName: binding
  - context: item
    description: DateTime or String item for the timestamp of the last test. Shown
      as relative time (e.g. "3 min ago").
    label: Last Test Time Item
    name: dateItem
    required: false
    type: TEXT
    groupName: binding
  - context: item
    description: String item with the server name or location. Shown next to the timestamp.
    label: Server Name Item
    name: serverItem
    required: false
    type: TEXT
    groupName: binding
  - name: planDown
    type: DECIMAL
    label: Download Plan (Mbit/s)
    description: Your contracted download speed in Mbit/s. The sparkline dashed line
      and the degradation warning (−X% below plan) are calculated against this value.
    required: false
    default: 150
    groupName: plan
  - name: planUp
    type: DECIMAL
    label: Upload Plan (Mbit/s)
    description: Your contracted upload speed in Mbit/s. Used the same way as the
      download plan for the upload column.
    required: false
    default: 20
    groupName: plan
  parameterGroups:
  - name: binding
    label: Binding Items
  - name: plan
    label: Plan Speeds
timestamp: Aug 20, 2026, 10:00:00 AM
component: oh-webframe
config:
  src: "='/static/speedtest.html?v=10&planDown='+(props.planDown||150)+'&planUp='+(props.planUp||20)+(props.downloadItem?'&dl='+props.downloadItem:'')+(props.uploadItem?'&ul='+props.uploadItem:'')+(props.triggerItem?'&run='+props.triggerItem:'')+(props.pingItem?'&pg='+props.pingItem:'')+(props.jitterItem?'&jt='+props.jitterItem:'')+(props.dateItem?'&dt='+props.dateItem:'')+(props.serverItem?'&sv='+props.serverItem:'')"
  height: 310
